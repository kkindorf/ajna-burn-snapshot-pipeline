<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajna Burn Monitor API</title>
    <meta
      name="description"
      content="Static AJNA burn snapshot used by the Ajna Burn Monitor frontend."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f6f3ee;
        color: #231f1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(680px, 100%);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(110, 95, 80, 0.18);
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 20px 48px rgba(35, 28, 20, 0.08);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0 0 1rem;
        color: #6d6257;
        line-height: 1.6;
      }

      .links {
        display: grid;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }

      a {
        color: #176b57;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      code {
        background: rgba(23, 107, 87, 0.08);
        padding: 0.15rem 0.35rem;
        border-radius: 0.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ajna Burn Monitor API</h1>
      <p>Static AJNA burn snapshot for the frontend dashboard.</p>
      <div class="links">
        <a href="/data/summary.json">/data/summary.json</a>
        <a href="/data/burns.json">/data/burns.json</a>
      </div>
      <p>
        The frontend reads this origin via
        <code>VITE_BURNS_DATA_BASE_URL</code>. The snapshot is refreshed daily
        from Etherscan.
      </p>
    </main>
  </body>
</html>
